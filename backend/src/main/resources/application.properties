# Server Configuration
server.port=${PORT:8081}

# Application Configuration
spring.application.name=changescope-backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Database Configuration (PostgreSQL driven by environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:changescope}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Boot Actuator / Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# GitHub Integration Configuration (GitHub App primary, PAT fallback for local development)
github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.app-id=${GITHUB_APP_ID:}
github.private-key=${GITHUB_PRIVATE_KEY:}
github.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
github.installation-id=${GITHUB_INSTALLATION_ID:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# Analysis Lifecycle Configuration
analysis.stale-timeout=${ANALYSIS_STALE_TIMEOUT:30m}
analysis.reconciliation-interval=${ANALYSIS_RECONCILIATION_INTERVAL:PT5M}

# Repository Indexing Asynchronous Executor
indexing.executor.core-pool-size=${INDEXING_EXECUTOR_CORE_POOL_SIZE:2}
indexing.executor.max-pool-size=${INDEXING_EXECUTOR_MAX_POOL_SIZE:4}
indexing.executor.queue-capacity=${INDEXING_EXECUTOR_QUEUE_CAPACITY:50}
indexing.executor.thread-name-prefix=${INDEXING_EXECUTOR_THREAD_NAME_PREFIX:indexing-}
indexing.executor.await-termination-seconds=${INDEXING_EXECUTOR_AWAIT_TERMINATION_SECONDS:30}
indexing.executor.wait-for-tasks-to-complete-on-shutdown=${INDEXING_EXECUTOR_WAIT_FOR_TASKS_TO_COMPLETE_ON_SHUTDOWN:true}

# Repository Indexing Delayed Retry Configuration
indexing.retry.max-attempts=${INDEXING_RETRY_MAX_ATTEMPTS:3}
indexing.retry.initial-delay=${INDEXING_RETRY_INITIAL_DELAY:10s}
indexing.retry.multiplier=${INDEXING_RETRY_MULTIPLIER:2.0}
indexing.retry.max-delay=${INDEXING_RETRY_MAX_DELAY:15m}
indexing.retry.jitter-factor=${INDEXING_RETRY_JITTER_FACTOR:0.2}
indexing.retry.check-interval=${INDEXING_RETRY_CHECK_INTERVAL:PT30S}
indexing.retry.batch-size=${INDEXING_RETRY_BATCH_SIZE:10}



