# Server Configuration
server.port=${PORT:8081}

# Application Configuration
spring.application.name=changescope-backend

# Database Configuration (PostgreSQL driven by environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:changescope}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Boot Actuator / Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# GitHub Integration Configuration (GitHub App primary, PAT fallback for local development)
github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.app-id=${GITHUB_APP_ID:}
github.private-key=${GITHUB_PRIVATE_KEY:}
github.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
github.installation-id=${GITHUB_INSTALLATION_ID:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# Analysis Lifecycle Configuration
analysis.stale-timeout=${ANALYSIS_STALE_TIMEOUT:30m}
analysis.reconciliation-interval=${ANALYSIS_RECONCILIATION_INTERVAL:PT5M}



