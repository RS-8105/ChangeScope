# Test Profile Properties
# Test In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:changescope_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Actuator Health
management.endpoints.web.exposure.include=health,info

# Analysis Lifecycle Configuration
analysis.reconciliation-interval=PT5M
analysis.stale-timeout=30m

# Repository Indexing Asynchronous Executor
indexing.executor.core-pool-size=2
indexing.executor.max-pool-size=4
indexing.executor.queue-capacity=50
indexing.executor.thread-name-prefix=indexing-
indexing.executor.await-termination-seconds=30
indexing.executor.wait-for-tasks-to-complete-on-shutdown=true

# Repository Indexing Delayed Retry Configuration
indexing.retry.max-attempts=3
indexing.retry.initial-delay=10s
indexing.retry.multiplier=2.0
indexing.retry.max-delay=15m
indexing.retry.jitter-factor=0.2
indexing.retry.check-interval=PT30S
indexing.retry.batch-size=10
